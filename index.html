</style></head><body><main><div id="stage" aria-label="可拖动旋转的三维玛格丽特酒杯"></div><button class="home" aria-label="返回酒单主页"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 14 16 4l12 10v14h-9v-9h-6v9H4Z"/></svg></button><div class="hint">DRAG TO ROTATE · 拖动旋转</div><hgroup><h1>玛格丽特</h1><p>MARGARITA</p></hgroup><aside class="recipe"><b>基酒</b>龙舌兰 / TEQUILA<b>调味</b>青柠汁<br>橙味利口酒<b>酒精度</b>≈ 24% vol<br><small>依实际配方而异</small></aside><div class="detail-bottom"><section class="details"><header>推荐搭配 <small style="font-size:9px">FOOD PAIRING</small></header><p>墨西哥玉米片 · 牛油果沙拉<br>炭烤鲜虾，唤醒清爽酸香。</p><button id="history">酒的历史 <span style="float:right"></span></button></section><button class="order" id="order">立即下单</button></div><div class="foot">寻味 / A TASTE TO REMEMBER</div></main><dialog id="modal"><h2 id="title"></h2><p id="content"></p><button id="close">关闭</button></dialog><script type="module">import * as THREE from 'https://esm.sh/three@0.170.0';
import * as T from 'https://esm.sh/three@0.170.0';
import {RoundedBoxGeometry} from 'https://esm.sh/three@0.170.0/examples/jsm/geometries/RoundedBoxGeometry.js';

// All detail is native 3D geometry; small repeated elements use GPU instances.
const sphere=new T.SphereGeometry(1,18,12),smallSphere=new T.SphereGeometry(1,7,5);
const iceGeo=new RoundedBoxGeometry(.48,.45,.46,4,.065);
const cache=new Map();
function mat(color,roughness=.3){const key=color+':'+roughness;if(!cache.has(key))cache.set(key,new T.MeshPhysicalMaterial({color,roughness,clearcoat:.85,clearcoatRoughness:.12}));return cache.get(key)}
const glass=new T.MeshPhysicalMaterial({color:'#fffaf4',roughness:.045,metalness:0,transparent:true,opacity:.22,side:T.DoubleSide,depthWrite:false,clearcoat:1,envMapIntensity:1.15});
const edgeGlass=new T.MeshPhysicalMaterial({color:'#fffaf4',roughness:.05,transparent:true,opacity:.46,depthWrite:false,clearcoat:1,envMapIntensity:1.4});
const iceMat=new T.MeshPhysicalMaterial({color:'#ecf8fa',transparent:true,opacity:.53,roughness:.09,metalness:.025,clearcoat:1,depthWrite:false,envMapIntensity:1.6});
const frostMat=new T.MeshStandardMaterial({color:'#ffffff',transparent:true,opacity:.13,roughness:.7,depthWrite:false});
const pith=mat('#f8f0c6',.58);
function random(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function mesh(parent,geometry,material,position=[0,0,0]){const m=new T.Mesh(geometry,material);m.position.set(...position);parent.add(m);return m}
function lathe(parent,points,material){return mesh(parent,new T.LatheGeometry(points.map(p=>new T.Vector2(...p)),128),material)}
function glassRing(parent,r,y,material=edgeGlass,tube=.012){const m=mesh(parent,new T.TorusGeometry(r,tube,10,96),material,[0,y,0]);m.rotation.x=Math.PI/2;return m}
function curves(parent,paths,color,opacity=1){const pts=[];for(const path of paths)for(let i=1;i<path.length;i++)pts.push(...path[i-1],...path[i]);const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(pts,3));const obj=new T.LineSegments(geo,new T.LineBasicMaterial({color,transparent:opacity<1,opacity}));parent.add(obj);return obj}
function tube(parent,points,r,color){const c=new T.CatmullRomCurve3(points.map(v=>new T.Vector3(...v)));return mesh(parent,new T.TubeGeometry(c,28,r,7,false),mat(color,.4))}
function instances(parent,count,geo,material,place){const m=new T.InstancedMesh(geo,material,count),d=new T.Object3D();for(let i=0;i<count;i++){d.position.set(0,0,0);d.rotation.set(0,0,0);d.scale.set(1,1,1);place(d,i);d.updateMatrix();m.setMatrixAt(i,d.matrix)}m.instanceMatrix.needsUpdate=true;parent.add(m);return m}
function peelGrain(){if(cache.has('peel-bump'))return cache.get('peel-bump');const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),rnd=random(41);x.fillStyle='#888';x.fillRect(0,0,128,128);for(let k=0;k<950;k++){x.fillStyle=k%3?'#737373':'#b0b0b0';x.beginPath();x.arc(rnd()*128,rnd()*128,.35+rnd()*.8,0,Math.PI*2);x.fill()}const tex=new T.CanvasTexture(c);tex.wrapS=tex.wrapT=T.RepeatWrapping;cache.set('peel-bump',tex);return tex}
function citrus(parent,{x,y,z=0,r=.4,kind='lime',tilt=-.3}){const g=new T.Group();g.name=kind+' slice with pulp vesicles';parent.add(g);g.position.set(x,y,z);g.rotation.set(.06,-.12,tilt);const orange=kind==='orange',lemon=kind==='lemon';const peel=mat(orange?'#da8220':lemon?'#dbb82b':'#65842a',.47);peel.bumpMap=peelGrain();peel.bumpScale=.012;const shell=mesh(g,new T.CylinderGeometry(r,r,.09,80),peel);shell.rotation.x=Math.PI/2;const rnd=random(91);for(const side of [-1,1]){const m=mesh(g,new T.CircleGeometry(r*.95,80),pith,[0,0,side*.047]);if(side<0)m.rotation.y=Math.PI;const sectorMat=mat('#ffffff',.22).clone();sectorMat.side=T.DoubleSide;const sectors=instances(g,10,new T.CircleGeometry(r*.85,18,.024,Math.PI/5-.05),sectorMat,(d,k)=>{d.position.z=side*.05;d.rotation.z=k*Math.PI/5});for(let k=0;k<10;k++)sectors.setColorAt(k,new T.Color(orange?(k%2?'#f3b84f':'#efab36'):lemon?(k%2?'#f4df84':'#e9d16c'):(k%2?'#d5df81':'#c8d36b')));sectors.instanceColor.needsUpdate=true;instances(g,230,smallSphere,mat(orange?'#ffcf7e':lemon?'#fff0ac':'#f0eaa4',.18),(d,k)=>{const a=k*2.399963,rad=r*.82*Math.sqrt((k+.4)/230);d.position.set(Math.cos(a)*rad,Math.sin(a)*rad,side*(.054+rnd()*.008));d.rotation.z=a-Math.PI/2;d.scale.set(r*(.014+rnd()*.013),r*(.048+rnd()*.04),.006)});mesh(g,new T.CircleGeometry(r*.05,12),pith,[0,0,side*.061])}instances(g,220,smallSphere,mat(orange?'#b66b22':lemon?'#b89c24':'#40631d',.65),(d,k)=>{const a=k*2.399963;d.position.set(Math.cos(a)*(r+.001),Math.sin(a)*(r+.001),(rnd()-.5)*.078);d.scale.setScalar(.0025+rnd()*.0025)});return g}
function ice(parent,positions,size=1){const rnd=random(713);positions.forEach((pos,i)=>{const g=new T.Group();g.position.set(...pos);g.rotation.set((rnd()-.5)*.35,rnd()*Math.PI,(rnd()-.5)*.5);g.scale.setScalar(size);g.name='rounded clear ice with internal fissures';parent.add(g);mesh(g,iceGeo,iceMat);const core=mesh(g,sphere,frostMat);core.scale.set(.1,.13,.085);curves(g,[[[-.18,.226,-.14],[-.05,.227,-.03],[.02,.227,-.07],[.16,.226,.12]],[[-.05,.227,-.03],[-.1,.227,.13]],[[-.23,-.1,.12],[-.234,.03,.04],[-.233,.15,.11]]],'#f4ffff',.6);instances(g,9,smallSphere,frostMat,d=>{d.position.set((rnd()-.5)*.28,(rnd()-.5)*.3,(rnd()-.5)*.25);d.scale.setScalar(.009+rnd()*.009)})})}
function crushedIce(parent,count,r,bottom,top){const rnd=random(123);instances(parent,count,iceGeo,iceMat,d=>{const a=rnd()*Math.PI*2,rad=Math.sqrt(rnd())*r;d.position.set(Math.cos(a)*rad,bottom+rnd()*(top-bottom),Math.sin(a)*rad);d.rotation.set(rnd()*3,rnd()*3,rnd()*3);const s=.24+rnd()*.38;d.scale.set(s,s*(.65+rnd()*.6),s)}).name='irregular crushed ice'}
function bubbles(parent,r,bottom,top,count=55){const rnd=random(97);instances(parent,count,smallSphere,new T.MeshPhysicalMaterial({color:'#fff8e0',transparent:true,opacity:.45,roughness:.08,depthWrite:false}),d=>{const a=rnd()*Math.PI*2,rad=r*Math.sqrt(rnd());d.position.set(Math.cos(a)*rad,bottom+rnd()*(top-bottom),Math.sin(a)*rad);d.scale.setScalar(.004+rnd()*.008)})}
function dew(parent,profile,count=85){const rnd=random(71),valid=profile.filter(p=>p[0]>.3);instances(parent,count,smallSphere,new T.MeshPhysicalMaterial({color:'#f5ffff',transparent:true,opacity:.32,roughness:.06,clearcoat:1,depthWrite:false}),d=>{const k=Math.floor(rnd()*(valid.length-1)),a=valid[k],b=valid[k+1],t=rnd(),r=a[0]+(b[0]-a[0])*t+.009,y=a[1]+(b[1]-a[1])*t,angle=rnd()*Math.PI*2;d.position.set(Math.cos(angle)*r,y,Math.sin(angle)*r);const s=.006+rnd()*.012;d.scale.set(s,s*(1+rnd()*.7),s*.65);d.rotation.y=-angle})}
function mint(parent,pos,angle=0,size=1){const g=new T.Group();g.position.set(...pos);g.rotation.set(-.4,angle,.2);g.scale.setScalar(size);g.name='mint leaf with veins';parent.add(g);const vertices=[],indices=[];for(let j=0;j<=18;j++){const t=j/18,w=Math.sin(t*Math.PI)*.15*(1+.055*Math.cos(t*28*Math.PI));for(const u of [-1,0,1])vertices.push(u*w,t*.48,Math.sin(t*Math.PI)*.035+(1-Math.abs(u))*.012)}for(let j=0;j<18;j++)for(let k=0;k<2;k++){const a=j*3+k;indices.push(a,a+1,a+3,a+1,a+4,a+3)}const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(vertices,3));geo.setIndex(indices);geo.computeVertexNormals();const leafmat=mat('#4a792c',.62).clone();leafmat.side=T.DoubleSide;mesh(g,geo,leafmat);const paths=[[[0,0,.013],[0,.24,.048],[0,.48,.013]]];for(let j=2;j<15;j+=2){let t=j/18,w=Math.sin(t*Math.PI)*.13;for(const side of [-1,1])paths.push([[0,t*.48,Math.sin(t*Math.PI)*.035+.014],[side*w,(t+.1)*.48,Math.sin((t+.1)*Math.PI)*.035+.005]])}curves(g,paths,'#9eb461',.65);return g}
function cherry(parent,x,y,z,r=.14){const c=mesh(parent,sphere,mat('#681426',.1),[x,y,z]);c.name='glossy cocktail cherry';c.scale.set(r,r*.94,r);const dimple=mesh(parent,new T.TorusGeometry(r*.16,.009,8,20),mat('#471326',.2),[x,y+r*.92,z]);dimple.rotation.x=Math.PI/2;tube(parent,[[x,y+r*.92,z],[x+.04,y+r+.13,z-.015],[x+.13,y+r+.25,z-.04]],.009,'#5b512d');return c}
function peelRibbon(parent,points,color,width=.07){const vertices=[],indices=[];for(const [x,y,z]of points)vertices.push(x,y-width,z,x,y+width,z);for(let i=0;i<points.length-1;i++){const a=i*2;indices.push(a,a+1,a+2,a+1,a+3,a+2)}const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(vertices,3));geo.setIndex(indices);geo.computeVertexNormals();const skin=mat(color,.4).clone();skin.side=T.FrontSide;skin.bumpMap=peelGrain();skin.bumpScale=.008;mesh(parent,geo,skin);const back=mat('#efe3b0',.7).clone();back.side=T.BackSide;mesh(parent,geo,back);return geo}
function foam(parent,r,y,count=240){const rnd=random(128);lathe(parent,[[0,y-.04],[r*.97,y-.04],[r,y],[r*.98,y+.035],[0,y+.04]],mat('#fff3dc',.8));instances(parent,count,smallSphere,mat('#fff8e9',.68),d=>{const a=rnd()*Math.PI*2,rad=r*Math.sqrt(rnd()),s=.008+rnd()*.017;d.position.set(Math.cos(a)*rad,y+.035,Math.sin(a)*rad);d.scale.set(s,s*.35,s)})}
function pineapple(parent){const g=new T.Group();g.name='pineapple wedge with rind and fibres';g.position.set(-.53,1.45,0);g.rotation.z=.23;parent.add(g);const shape=new T.Shape();shape.moveTo(-.08,0);shape.lineTo(-.08,.72);shape.quadraticCurveTo(.18,.78,.57,.36);shape.closePath();const flesh=mat('#e9c35c',.48);mesh(g,new T.ExtrudeGeometry(shape,{depth:.11,bevelEnabled:true,bevelSize:.015,bevelThickness:.015,bevelSegments:3,steps:1}),flesh);const paths=[];for(let k=0;k<17;k++){const t=k/17;paths.push([[-.055,.035+t*.64,.13],[.07+t*.25,.13+t*.38,.13],[.14+t*.33,.22+t*.22,.13]])}curves(g,paths,'#f7dd92',.65);peelRibbon(g,Array.from({length:28},(_,k)=>{const t=k/27;return[-.08+t*.65,.72-t*.36,0]}),'#a7a048',.045);instances(g,32,smallSphere,mat('#8c832f',.65),(d,k)=>{const t=k/31;d.position.set(-.08+t*.65,.72-t*.36,.02+(k%2)*.055);d.scale.set(.016,.022,.012);d.rotation.z=-.5});for(let k=0;k<3;k++){const leaf=mint(g,[-.07,.66,.02],.1+k*.7,.55);leaf.rotation.z=-.7+k*.5}return g}

function cocktailModel(i){const g=new T.Group();g.userData.index=i;const color=['#efd37b','#d8dfa0','#aa331e','#ae6b24','#e7dfbc','#ded69b','#81301e','#cc5274','#d6a64e','#efdfac'][i];const liquid=new T.MeshPhysicalMaterial({color,roughness:i===9?.32:.11,transparent:i!==9,opacity:i===4?.36:i===5?.69:.83,clearcoat:1,depthWrite:false,envMapIntensity:.65});
let profile,fill,r,top;
if(i===0){r=1.64;top=1.47;profile=[[0,-2.8],[.65,-2.8],[1.05,-2.75],[1.1,-2.7],[1.05,-2.65],[.7,-2.6],[.16,-2.48],[.09,-2.28],[.07,-.6],[.1,-.47],[.2,-.34],[.4,-.2],[.56,-.02],[.7,.15],[1.05,.5],[1.36,.95],[1.57,1.3],[r,top]];fill=[[0,-.26],[.3,-.16],[.59,.08],[.99,.53],[1.43,1.2],[0,1.2]]}
else if(i===1){r=.64;top=1.4;profile=[[0,-1.6],[.49,-1.6],[.57,-1.57],[.6,-1.51],[.61,-1.34],[.62,.4],[r,top]];fill=[[0,-1.4],[.53,-1.4],[.57,1.16],[0,1.16]]}
else if(i===2||i===3){r=i===2?.85:.79;top=.55;profile=[[0,-1.25],[r-.1,-1.25],[r-.03,-1.22],[r,-1.14],[r+.01,-.85],[r+.025,top]];fill=[[0,-1.04],[r-.08,-1.04],[r-.06,.36],[0,.36]]}
else if(i===4||i===7){r=i===4?1.24:1.12;top=1.12;profile=[[0,-1.9],[.6,-1.9],[.75,-1.87],[.77,-1.83],[.64,-1.79],[.14,-1.69],[.06,-1.56],[.055,-.59],[.1,-.48],[r,top]];fill=[[0,-.43],[.1,-.39],[r*.87,.92],[0,.92]]}
else if(i===5||i===6){r=i===5?1.03:.9;top=.93;profile=[[0,-1.9],[.57,-1.9],[.69,-1.86],[.7,-1.82],[.56,-1.78],[.12,-1.65],[.055,-1.51],[.055,-.45],[.18,-.31],[.38,-.22],[.58,-.08],[.82,.14],[r,.38],[r+.035,.68],[r,top]];fill=[[0,-.22],[.29,-.16],[.57,.02],[r-.06,.4],[r-.05,.74],[0,.74]]}
else if(i===8){r=.74;top=.95;profile=[[0,-1.6],[.48,-1.6],[.62,-1.57],[.65,-1.52],[.5,-1.47],[.1,-1.39],[.07,-1.08],[.2,-.94],[.38,-.77],[.56,-.5],[.67,-.2],[.74,.3],[r,top]];fill=[[0,-.75],[.3,-.66],[.57,-.22],[.66,.43],[.66,.73],[0,.73]]}
else{r=.7;top=1.5;profile=[[0,-1.9],[.51,-1.9],[.65,-1.87],[.68,-1.82],[.49,-1.77],[.13,-1.63],[.09,-1.08],[.27,-.94],[.49,-.77],[.69,-.52],[.78,-.25],[.79,.05],[.72,.42],[.63,.82],[.62,1.12],[.66,1.35],[r,top]];fill=[[0,-.72],[.39,-.68],[.68,-.3],[.69,.15],[.54,.83],[.56,1.25],[0,1.25]]}
g.userData.glassProfile={profile:profile.map(p=>[...p]),rimRadius:r,lipY:top};
// Include a separate inner wall and a rounded lip; the base remains closed.
lathe(g,profile,glass);const wall=profile.slice(i===1||i===2||i===3?3:Math.max(3,profile.findIndex(p=>p[1]>=-.5))).map(([x,y])=>[Math.max(.01,x-.022),y]);if(wall.length>1)lathe(g,wall,glass);glassRing(g,r,top,edgeGlass,.014);
const fy=fill.at(-1)[1],fr=fill.at(-2)[0];lathe(g,fill,liquid);const surface=mesh(g,new T.CircleGeometry(fr,96),liquid,[0,fy+.002,0]);surface.rotation.x=-Math.PI/2;glassRing(g,fr,fy,edgeGlass,.006);

function measureGlassProfile({profile,rimRadius,lipY}){
 const points=profile.map(p=>[...p]);
 for(let i=0;i<12;i++){const a=i*Math.PI/6;points.push([rimRadius+.014*Math.cos(a),lipY+.014*Math.sin(a)])}

}

  for(const [radius,height]of bounds.profile)for(const side of [-1,1]){

   const py=(cosTilt*y-sinTilt*z)/(depth*tan);min=Math.min(min,py);max=Math.max(max,py);
  }

  let lo=0,hi=20/Math.max(.01,bounds.height)*depthCenter/distance;
  for(let i=0;i<15;i++){const mid=(lo+hi)/2,e=extents(mid);if(e.max-e.min>desiredHeight)hi=mid;else lo=mid}

  const e=extents(scale);verticalOffset-=(e.min+e.max)*.5*depthCenter*tan;

}

gallery.tabIndex=0;gallery.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();choose(selected+(e.key==='ArrowRight'?1:-1))}if(e.key==='Enter')enter()};
gallery.onpointerdown=e=>{if(!e.isPrimary||e.button!==0)return;pointerId=e.pointerId;dragging=true;axis=null;startX=lastX=e.clientX;startY=e.clientY;lastTime=e.timeStamp;velocity=0;moved=0;mode='drag';gallery.setPointerCapture(e.pointerId)};
gallery.onpointermove=e=>{if(!dragging||e.pointerId!==pointerId)return;const totalX=e.clientX-startX,totalY=e.clientY-startY;if(!axis&&Math.hypot(totalX,totalY)>6)axis=Math.abs(totalX)>Math.abs(totalY)?'x':'y';if(axis==='y')return;if(axis!=='x')return;const delta=e.clientX-lastX,dt=Math.max(1,e.timeStamp-lastTime),sensitivity=step/(gallery.clientWidth*.44);rotation+=delta*sensitivity;velocity=velocity*.45+(delta*sensitivity/dt)*.55;moved=Math.max(moved,Math.abs(totalX));lastX=e.clientX;lastTime=e.timeStamp;updateSelection()};
function finishDrag(e,cancelled=false){if(!dragging||e.pointerId!==pointerId)return;dragging=false;if(gallery.hasPointerCapture(e.pointerId))gallery.releasePointerCapture(e.pointerId);if(e.timeStamp-lastTime>100)velocity=0;velocity=Math.max(-.006,Math.min(.006,velocity));if(cancelled||axis==='y'){velocity=0;target=Math.round(rotation/step)*step;mode='snap'}else if(moved<7&&!axis){target=Math.round(rotation/step)*step;mode='snap';if(Math.abs(target-rotation)<.055)enter()}else{mode='coast';target=Math.round(rotation/step)*step}pointerId=null}
gallery.onpointerup=e=>finishDrag(e);gallery.onpointercancel=e=>finishDrag(e,true);gallery.onlostpointercapture=e=>{if(dragging)finishDrag(e,true)};
const stage=document.querySelector('#stage'),main=document.querySelector('main');
const margaritaDetail=models[0];margaritaDetail.visible=false;
function detailModel(){return detailIndex===0?margaritaDetail:models[detailIndex]}
const AUTO_ROTATE_RADIANS_PER_SECOND=.16;
let detailIndex=0,detailAngle=0,detailVelocity=0,detailDrag=false,detailPointer=null,detailX=0,detailTime=0;
rr.domElement.style.position='absolute';rr.domElement.style.inset='0';rr.domElement.style.touchAction='pan-y';
function fitDetailGlass(){
 const current=detailModel();current.rotation.set(0,0,0);current.position.set(0,0,0);current.scale.setScalar(1);current.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(current),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());
 const visibleHeight=2*Math.hypot(cam2.position.y,cam2.position.z)*Math.tan(cam2.fov*Math.PI/360),visibleWidth=visibleHeight*cam2.aspect;
 const scale=Math.min(visibleHeight*.94/size.y,visibleWidth*.94/size.x);
 current.scale.setScalar(scale);current.position.set(-center.x*scale,-center.y*scale,0);current.rotation.y=detailAngle;return {bounds,scale};
}
function renderSize(){
 const container=lobby.hidden?stage:gallery,w=container.clientWidth;
 if(!w)return;
 cam2.clearViewOffset();
 if(!lobby.hidden){const h=gallery.clientHeight;if(!h)return;rr.setSize(w,h);cam2.aspect=w/h;cam2.updateProjectionMatrix();return}
 // Keep the same glass size, but extend the camera window beyond the old lower edge.
 const baseHeight=parseFloat(getComputedStyle(stage).height);
 if(!baseHeight)return;
 cam2.aspect=w/baseHeight;cam2.updateProjectionMatrix();cam2.updateMatrixWorld(true);
 const current=detailModel(),{bounds,scale}=fitDetailGlass(),axis=new THREE.Vector3(0,1,0);
 let minPixelY=Infinity,maxPixelY=-Infinity;
 // Project a conservative model envelope through a complete turn, including the base.
 for(let turn=0;turn<48;turn++)for(const x of [bounds.min.x,bounds.max.x])for(const y of [bounds.min.y,bounds.max.y])for(const z of [bounds.min.z,bounds.max.z]){
  const projected=new THREE.Vector3(x,y,z).applyAxisAngle(axis,turn*Math.PI/24).multiplyScalar(scale).add(current.position).project(cam2);
  const pixelY=(1-projected.y)*baseHeight/2;
  minPixelY=Math.min(minPixelY,pixelY);maxPixelY=Math.max(maxPixelY,pixelY);
 }
 const top=Math.floor(Math.min(-16,minPixelY-16)),bottom=Math.ceil(Math.max(baseHeight+100,maxPixelY+16)),height=bottom-top;
 const padding=height-baseHeight;
 if(stage.style.paddingBottom!==padding+'px')stage.style.paddingBottom=padding+'px';
 rr.setSize(w,height);cam2.setViewOffset(w,baseHeight,0,top,w,height);cam2.updateProjectionMatrix();
}
function writeURL(id,replace=false){const url=new URL(location.href);url.hash='';if(id)url.searchParams.set('drink',id);else url.searchParams.delete('drink');try{history[replace?'replaceState':'pushState']({drink:id},'',url)}catch{location.hash=id||'home'}}
function showHome(){document.querySelector('#modal').close();detailDrag=false;lobby.hidden=false;main.inert=true;main.setAttribute('aria-hidden','true');stage.dataset.drink='home';gallery.append(rr.domElement);margaritaDetail.visible=false;cam2.fov=35;cam2.position.set(0,2.1,11);cam2.lookAt(0,0,0);document.title='寻味 · 经典鸡尾酒';renderSize()}
function home(){writeURL(null);showHome();window.scrollTo(0,0)}
function openDrink(index){detailIndex=index;const d=drinkPages[index];document.querySelector('#modal').close();lobby.hidden=true;main.inert=false;main.removeAttribute('aria-hidden');stage.dataset.drink=d.id;document.title='寻味 · '+d.name;
 document.querySelector('hgroup h1').textContent=d.name;document.querySelector('hgroup p').textContent=d.english.toUpperCase();document.querySelector('hgroup h1').style.fontSize=d.name.length>4?'clamp(30px,8vw,48px)':'';
 const recipe=document.querySelector('.recipe');recipe.replaceChildren();for(const [label,value]of [['基酒',d.base],['调味',d.seasoning],['酒精度',d.abv+' vol']]){const b=document.createElement('b');b.textContent=label;recipe.append(b,document.createTextNode(value))}const note=document.createElement('small');note.textContent='估算值，依配方与稀释变化';recipe.append(document.createElement('br'),note);
 document.querySelector('.details p').textContent=d.pairing;document.querySelector('.details p').style.whiteSpace='pre-line';stage.setAttribute('aria-label','拖动旋转'+d.name+'的三维酒杯');detailAngle=0;detailVelocity=0;detailDrag=false;
 stage.append(rr.domElement);cam2.fov=7.5;cam2.position.set(0,12,45);cam2.lookAt(0,0,0);models.forEach(g=>g.visible=false);margaritaDetail.visible=false;
 const current=detailModel();current.visible=true;current.position.set(.05,.1,0);current.rotation.set(0,0,0);current.scale.setScalar(index===0?1:1.35);
 renderSize();window.scrollTo(0,0)
}
function enter(){writeURL(drinkPages[selected].id);openDrink(selected)}
function route(){let id=location.hash==='#home'?null:new URL(location.href).searchParams.get('drink');if(location.hash&&location.hash!=='#home')id=decodeURIComponent(location.hash.slice(1));if(id==='piña-colada')id='pina-colada';const index=drinkPages.findIndex(d=>d.id===id);if(index<0){showHome();return}selected=index;rotation=target=-index*step;mode='snap';velocity=0;updateSelection();openDrink(index)}
function showDialog(title,content){document.querySelector('#title').textContent=title;document.querySelector('#content').textContent=content;document.querySelector('#modal').showModal()}
 document.querySelector('#close').onclick=()=>document.querySelector('#modal').close();
 document.querySelector('#history').onclick=()=>{const d=drinkPages[detailIndex];showDialog(d.name+' · 酒的历史',d.story+'\n\n经典配方：'+d.formula)};
 document.querySelector('#order').onclick=()=>showDialog('已选择 · '+drinkPages[detailIndex].name,'这杯风味已为你选好。');
 document.querySelector('.home').onclick=home;document.querySelector('.home').setAttribute('aria-label','返回旋转酒单主页');document.querySelector('#enter').onclick=enter;
 rr.domElement.onpointerdown=e=>{if(!lobby.hidden||!e.isPrimary||e.button!==0)return;e.stopPropagation();detailDrag=true;detailPointer=e.pointerId;detailX=e.clientX;detailTime=e.timeStamp;detailVelocity=0;rr.domElement.setPointerCapture(e.pointerId)};
 rr.domElement.onpointermove=e=>{if(!detailDrag||e.pointerId!==detailPointer)return;e.stopPropagation();const delta=(e.clientX-detailX)*.009;detailAngle+=delta;detailVelocity=detailVelocity*.4+(delta/Math.max(1,e.timeStamp-detailTime))*.6;detailX=e.clientX;detailTime=e.timeStamp};
 function endDetail(e){if(e.pointerId!==detailPointer)return;e.stopPropagation();detailDrag=false;if(e.timeStamp-detailTime>100)detailVelocity=0;if(rr.domElement.hasPointerCapture(e.pointerId))rr.domElement.releasePointerCapture(e.pointerId);detailPointer=null}
 rr.domElement.onpointerup=endDetail;rr.domElement.onlostpointercapture=endDetail;rr.domElement.onpointercancel=e=>{detailVelocity=0;endDetail(e)};rr.domElement.tabIndex=0;rr.domElement.setAttribute('aria-label','左右拖动旋转酒杯');rr.domElement.onkeydown=e=>{if(lobby.hidden&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();detailAngle+=e.key==='ArrowLeft'?-.15:.15}};
 window.addEventListener('popstate',route);window.addEventListener('hashchange',route);
 route();
const viewObserver=new ResizeObserver(renderSize);viewObserver.observe(gallery);viewObserver.observe(stage);let previousFrame=0;rr.setAnimationLoop(now=>{const dt=previousFrame?Math.min(40,now-previousFrame):16.67;previousFrame=now;if(lobby.hidden){if(!detailDrag){detailAngle+=(detailVelocity+AUTO_ROTATE_RADIANS_PER_SECOND/1000)*dt;detailVelocity*=Math.exp(-dt/180)}detailModel().rotation.y=detailAngle;rr.render(scene2,cam2);return;}if(!dragging){if(mode==='coast'){rotation+=velocity*dt;velocity*=Math.exp(-dt/190);if(Math.abs(velocity)<.00022){target=Math.round(rotation/step)*step;mode='snap'}}else{rotation+=(target-rotation)*(1-Math.exp(-dt/100));if(Math.abs(target-rotation)<.0001)rotation=target}}updateSelection();models.forEach((g,i)=>{const pose=carouselPose(g.userData.carouselBounds,i*step+rotation);g.position.set(pose.x,pose.y,pose.z);g.rotation.set(0,pose.yaw,0);g.scale.setScalar(pose.scale);g.visible=pose.visible});rr.render(scene2,cam2)});
</script></body></html>
